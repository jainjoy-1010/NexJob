spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:uploads}
  cors:
    # REQUIRED on Render: set FRONTEND_URL=https://your-app.vercel.app
    # Supports comma-separated multiple origins: https://app.vercel.app,https://custom.domain.com
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.nexjob: INFO
  file:
    name: ${LOG_FILE:logs/app.log}
