spring:
  application:
    name: nexjob-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: nexjob-super-secret-jwt-signing-key-for-production-environment-2026-secure!
    expiration-ms: 86400000
  upload:
    dir: uploads

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:~/test
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
