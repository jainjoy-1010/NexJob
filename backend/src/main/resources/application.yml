spring:
  application:
    name: nexjob-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:nexjob-super-secret-jwt-signing-key-for-dev-environment-2026}
    expiration-ms: 86400000
  upload:
    dir: uploads
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

